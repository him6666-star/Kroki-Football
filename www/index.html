function kname(a){const c=Array.isArray(a)?a[0]:a;if(!c)return'?';let m;if(m=/^Key(.)$/.exec(c))return m[1];if(m=/^Digit(\d)$/.exec(c))return m[1];if(m=/^Numpad(\d)$/.exec(c))return'Num '+m[1];const N={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Space:L('Boşluk','Space'),ShiftLeft:L('Sol Shift','Left Shift'),ShiftRight:L('Sağ Shift','Right Shift'),ControlLeft:L('Sol Ctrl','Left Ctrl'),ControlRight:L('Sağ Ctrl','Right Ctrl'),AltLeft:L('Sol Alt','Left Alt'),AltRight:L('Sağ Alt','Right Alt'),Enter:'Enter',NumpadEnter:'Num Enter',Tab:'Tab',Slash:'/',Period:'.',Comma:',',Semicolon:';',Quote:"'",NumpadAdd:'Num +',NumpadSubtract:'Num -',NumpadMultiply:'Num *',NumpadDivide:'Num /',NumpadDecimal:'Num .',Backspace:'Backspace'};return N[c]||c}

  h+='</table><div class="row"><button onclick="resetKeys()">'+L('Varsayılana dön','Reset to default')+'</button><button onclick="settingsBack()">'+L('Geri','Back')+'</button></div><small>'+L('Bir tuşa tıkla, sonra yeni tuşa bas (Esc = iptal). Aynı tuş başka işlemdeyse yer değiştirir. P, M, Z ve Esc ayrılmıştır. 1 oyunculu modda iki tuş grubu birlikte çalışır.','Click a key, then press the new key (Esc = cancel). If the key is already used it swaps. P, M, Z and Esc are reserved. In 1-player mode both key sets work together.')+'</small>'}

  h+='<div style="margin:8px 0">'+L('Kamera yakınlığı:','Camera zoom:')+'</div><div class="row">'+[[0,L('Otomatik','Auto')],[1,'1×'],[2,'1.4×']].map(([k,n])=>'<button style="padding:6px 12px;'+(zm==k?HI:'')+'" onclick="setZm('+k+')">'+n+'</button>').join('')+'</div>';
  h+='<div style="margin:12px 0 6px">'+L('Dokunmatik kontroller:','Touch controls:')+'</div><div class="row">'+[['auto',L('Otomatik','Auto')],['on',L('Açık','On')],['off',L('Kapalı','Off')]].map(([k,n])=>'<button style="padding:6px 12px;'+(ST.touch==k?HI:'')+'" onclick="ST.touch=\''+k+'\';saveST();settings()">'+n+'</button>').join('')+'</div><div style="margin:12px 0 6px">'+L('Grafik kalitesi:','Graphics:')+'</div><div class="row">'+[['auto',L('Otomatik','Auto')],['low',L('Düşük (akıcı)','Low (smooth)')],['high',L('Yüksek','High')]].map(([k,n])=>'<button style="padding:6px 12px;'+(ST.gfx==k?HI:'')+'" onclick="ST.gfx=\''+k+'\';saveST();settings()">'+n+'</button>').join('')+'</div><div class="row" style="margin-top:14px"><button style="'+(ST.fps?HI:'')+'" onclick="ST.fps=!ST.fps;saveST();settings()">'+L('FPS göster: ','Show FPS: ')+(ST.fps?L('Açık','On'):L('Kapalı','Off'))+'</button></div><div class="row" style="margin-top:14px"><button style="'+(ST.shk?HI:'')+'" onclick="ST.shk=!ST.shk;saveST();settings()">'+L('Ekran sarsıntısı: ','Screen shake: ')+(ST.shk?L('Açık','On'):L('Kapalı','Off'))+'</button></div>'+back}
 else if(spage=='theme'){h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px auto;width:min(420px,88vw)">'+Object.keys(TH).map(k=>{const t=TH[k],sel=(ST.theme||'grass')==k;return '<button onclick="setTheme(\''+k+'\');settings()" style="padding:0;overflow:hidden;border-radius:14px;border:2px solid '+(sel?'#7cc4ee':'transparent')+';background:#1a2e28;text-align:center"><img src="'+themeThumb(k)+'" style="display:block;width:100%;height:auto;background:linear-gradient(135deg,'+t.prev[0]+','+t.prev[1]+')"><div style="padding:8px;font-weight:700">'+t.n[ST.lang=='en'?1:0]+'</div></button>'}).join('')+'</div>'+back}

 else if(spage=='snd'){h+='<div style="margin:12px 0 4px">'+L('Ses efektleri seviyesi','Sound effects volume')+'</div><div class="row" style="align-items:center"><input type="range" min="0" max="100" value="'+Math.round(ST.sfx*100)+'" oninput="ST.sfx=this.value/100;applyAudio();saveST();this.nextElementSibling.textContent=this.value+\'%\'" onchange="sfxKick(true)" style="width:200px"><b style="min-width:44px">'+Math.round(ST.sfx*100)+'%</b></div>'+

 else if(spage=='mus'){h+='<div class="row" style="margin:14px 0"><button style="'+(ST.musOn?HI:'')+'" onclick="ST.musOn=!ST.musOn;applyAudio();saveST();au();settings()">'+L('Müzik: ','Music: ')+(ST.musOn?L('Açık','On'):L('Kapalı','Off'))+'</button></div><div style="margin:4px 0">'+L('Müzik seviyesi','Music volume')+'</div><div class="row" style="align-items:center"><input type="range" min="0" max="100" value="'+Math.round(ST.mus*100)+'" oninput="ST.mus=this.value/100;applyAudio();saveST();this.nextElementSibling.textContent=this.value+\'%\'" style="width:200px"><b style="min-width:44px">'+Math.round(ST.mus*100)+'%</b></div><small>'+L('Müzik ilk tıklama/tuş basışından sonra başlar.','Music starts after your first click or key press.')+'</small>'+back}

const CML=[['Yön.','Dir.'],['1×','1×'],['1.4×','1.4×'],['1.7×','1.7×'],['2.2×','2.2×']];
function camNext(){const L=[1,1.4,1.7,2.2];zm=(zm+1)%3;if(zm>0)cam.z=L[zm-1];au();camLbl()}

const GS=.58;let kfx=[],gcam=null,zm=2,netFx=[null,null],bars=[],bused=[0,0],kult=[0,0],swd=[],trail=[],bh=[],clock=0,fxs=[],AC=null,mute=false,msg2='',msg2t=0;

const L=(t,e)=>ST.lang=='en'?e:t;
const EN={'GOL!':'GOAL!','PENALTI!':'PENALTY!','SET!':'WALL!','FAUL!':'FOUL!','ALEVLİ ŞUT!':'FIRE SHOT!','ARA PASI!':'THROUGH BALL!','ORTA!':'CROSS!','İKİNCİ YARI':'SECOND HALF','GOL KRALI!':'GOAL KING!','ÇAT!':'SLASH!','SAPLA!':'STAB!','TAK!':'CHOP!','KAPIŞ!':'GRAB!'};

let MG=null,MU=null,mTimer=null,mStep=0,mNext=0,HAT=null;
function applyAudio(){if(!MG)return;const pz_=state=='pause';MG.gain.value=mute?0:ST.sfx*(pz_?.2:1);MU.gain.value=(mute||!ST.musOn)?0:ST.mus*(MFILE?.9:.35)*(pz_?.45:1)}
function mt(f,t,d,ty,v){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MU);o.start(t);o.stop(t+d+.03)}
function mk2(t,v){const a=AC;if(!HAT){const n=Math.floor(a.sampleRate*.05),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);HAT=b}const sr=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();sr.buffer=HAT;f.type='highpass';f.frequency.value=6500;g.gain.value=v;sr.connect(f);f.connect(g);g.connect(MU);sr.start(t)}
const CH_=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function musicTick(){if(!AC||!MU||AC.state!='running'||MFILE)return;const sp=60/116/4;if(mNext<AC.currentTime)mNext=AC.currentTime+.05;while(mNext<AC.currentTime+.35){const st=mStep%16,bar=Math.floor(mStep/16)%4,ch=CH_[bar],t=mNext;
 if(st%4==0){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(MU);o.start(t);o.stop(t+.2)}

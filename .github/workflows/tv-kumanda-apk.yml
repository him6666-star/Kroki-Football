name: TV Kumanda APK
# LG TV Wi-Fi kumanda: test APK. Kumanda tv-kumanda/ klasorunden alinir. Sadece elle calisir (Run workflow).
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-kumanda-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Kumandayi www klasorune koy
        run: |
          rm -rf www && mkdir www
          cp -r ../tv-kumanda/. www/
          ls www
      - name: Android projesini olustur
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm install
          npx cap add android
          python3 patch_android.py
          npx cap sync android
      - name: Test APK derle
        working-directory: tv-kumanda-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK'yi indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: tv-kumanda-apk-1.0.${{ github.run_number }}
          path: tv-kumanda-android/android/app/build/outputs/apk/debug/app-debug.apk

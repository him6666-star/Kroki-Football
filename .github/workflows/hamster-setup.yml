name: Hamster Google giris kurulumu
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anahtari yaz
        run: echo '${{ secrets.FIREBASE_KEY }}' > "$RUNNER_TEMP/key.json"
      - name: Android uygulamasini kaydet, SHA-1 ekle, google-services.json al
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        run: |
          F="npx -y firebase-tools@13"
          PKG=com.hamstermuhendis.game
          $F apps:list ANDROID --project scribble-kick --json > apps.json || true
          APPID=$(node -e "try{const j=require('./apps.json');const a=(j.result||[]).find(x=>x.packageName=='$PKG');console.log(a?a.appId:'')}catch(e){console.log('')}")
          if [ -z "$APPID" ]; then
            $F apps:create ANDROID "Hamster Muhendis" --package-name $PKG --project scribble-kick --json > created.json
            APPID=$(node -e "const j=require('./created.json');console.log((j.result||{}).appId||'')")
            echo "::notice::Android uygulamasi olusturuldu: $APPID"
          else echo "::notice::Android uygulamasi zaten var: $APPID"; fi
          $F apps:android:sha:create "$APPID" a86906a647fb0b4d56d2554876ddd0f3bdac7c15 --project scribble-kick || echo "::notice::SHA-1 zaten ekli olabilir"
          sleep 20
          $F apps:sdkconfig ANDROID "$APPID" --project scribble-kick --out hamster-web/google-services.json
          node -e "const j=require('./hamster-web/google-services.json');const c=j.client.find(x=>x.client_info.android_client_info.package_name=='$PKG');console.log('::notice::google-services.json: istemci='+(!!c)+' oauth='+(c?c.oauth_client.length:0))"
          rm -f apps.json created.json
      - name: Web sitesini yetkili alan adlarina ekle
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json"
          T=$(gcloud auth print-access-token)
          U=https://identitytoolkit.googleapis.com/admin/v2/projects/scribble-kick/config
          curl -s -H "Authorization: Bearer $T" -H "x-goog-user-project: scribble-kick" "$U" > cfg.json
          node -e "const j=require('./cfg.json');const d=j.authorizedDomains||[];['hamstermuhendis.web.app','hamstermuhendis.firebaseapp.com'].forEach(x=>{if(!d.includes(x))d.push(x)});require('fs').writeFileSync('new.json',JSON.stringify({authorizedDomains:d}));console.log('::notice::alanlar: '+d.join(', '))"
          curl -s -X PATCH -H "Authorization: Bearer $T" -H "x-goog-user-project: scribble-kick" -H "Content-Type: application/json" "$U?updateMask=authorizedDomains" -d @new.json > res.json
          node -e "const j=require('./res.json');console.log(j.error?'::warning::alan ekleme hatasi: '+JSON.stringify(j.error).slice(0,300):'::notice::yetkili alanlar guncellendi')"
          rm -f cfg.json new.json res.json
      - name: Firestore kurallarini yukle
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        run: |
          RC=0; OUT=$(npx -y firebase-tools@13 deploy --only firestore:rules --project scribble-kick --non-interactive 2>&1) || RC=$?
          echo "$OUT" | tail -15
          echo "::notice::kurallar: $(echo "$OUT" | grep -iE 'released|error|complete' | head -3 | tr '\n' ' ')"
          exit $RC
      - name: google-services.json dosyasini depoya kaydet
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add hamster-web/google-services.json
          git diff --cached --quiet || { git commit -m "Hamster: google-services.json"; git push; }

name: Amiral Batti online test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/amiral_room_test.py https://amiral-batti.web.app
      - name: Test kayitlarini temizle
        if: always()
        run: |
          echo '${{ secrets.FIREBASE_KEY }}' > "$RUNNER_TEMP/key.json"
          npm i --no-save firebase-admin@12 >/dev/null 2>&1
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json" node tools/amiral_test_cleanup.js || true

name: Raf Izi magaza sayfasi
on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Diller, virgulle (or. en-US,de-DE)"
        default: "en-US"
jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-api-python-client google-auth
      - name: Play'e yukle
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for L in $(echo "${{ github.event.inputs.lang }}" | tr ',' ' '); do
            python tools/play_listing.py com.fairridegames.rafizi "$L" "kitaplik-android/store/$L"
          done

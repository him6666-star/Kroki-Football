name: Hamster web yukle
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site adi (site-adi.web.app)"
        default: "hamster"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anahtari yaz
        run: echo '${{ secrets.FIREBASE_KEY }}' > "$RUNNER_TEMP/key.json"
      - name: Site adini ayarla
        working-directory: hamster-web
        run: |
          sed -i 's/"site": "[^"]*"/"site": "${{ github.event.inputs.site }}"/' firebase.json
      - name: Site yoksa olustur (dolusa siradaki adi dene)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        working-directory: hamster-web
        run: |
          F="npx -y firebase-tools@13"
          $F hosting:sites:list --project scribble-kick > sites.txt 2>&1 || true
          CHOSEN=""
          for S in ${{ github.event.inputs.site }} hamster-muhendis hamstermuhendis hamster-engineer; do
            if grep -qw "$S" sites.txt; then CHOSEN=$S; echo "::notice::Site zaten projede: $S"; break; fi
            OUT=$($F hosting:sites:create "$S" --project scribble-kick --non-interactive 2>&1) && { CHOSEN=$S; echo "::notice::Site olusturuldu: $S"; break; }
            echo "::warning::$S alinamadi: $(echo "$OUT" | grep -iE 'error|exist|taken|denied|permission' | head -3 | tr '\n' ' ')"
          done
          rm -f sites.txt
          [ -n "$CHOSEN" ] || { echo "::error::Hicbir site adi alinamadi"; exit 1; }
          sed -i "s/\"site\": \"[^\"]*\"/\"site\": \"$CHOSEN\"/" firebase.json
      - name: Yukle
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        working-directory: hamster-web
        run: |
          RC=0; OUT=$(npx -y firebase-tools@13 deploy --only hosting --project scribble-kick --non-interactive 2>&1) || RC=$?
          echo "$OUT" | tail -20
          echo "::notice::$(echo "$OUT" | grep -iE 'Hosting URL|error' | head -3 | tr '\n' ' ')"
          exit $RC
